<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MANET Radio Web Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Embedded Network Management</p>
        <h1>MANET Radio Web Console</h1>
      </div>
      <div class="toolbar">
        <button id="refresh-btn" class="ghost">Refresh Snapshot</button>
        <button id="optimize-btn" class="ghost">Optimize Channels</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel panel-map">
        <div class="panel-header">
          <h2>Topology Map</h2>
          <span id="tick-label">Tick 0</span>
        </div>
        <canvas id="topology-canvas" width="640" height="320"></canvas>
      </section>

      <section class="panel panel-kpi">
        <h2>Network KPIs</h2>
        <div id="kpi-grid" class="kpi-grid"></div>
      </section>

      <section class="panel panel-nodes">
        <h2>Node Controls</h2>
        <div id="nodes-list" class="nodes-list"></div>
      </section>

      <section class="panel panel-route">
        <h2>Route Analysis</h2>
        <div class="route-controls">
          <select id="route-src"></select>
          <select id="route-dst"></select>
          <button id="route-btn">Analyze</button>
        </div>
        <pre id="route-output" class="route-output">Select src/dst and analyze route.</pre>

        <h3>R1 Routing Summary</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Dest</th>
                <th>Path</th>
                <th>Latency</th>
                <th>Bottleneck</th>
              </tr>
            </thead>
            <tbody id="routes-body"></tbody>
          </table>
        </div>
      </section>

      <section class="panel panel-links">
        <h2>Link Table</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>A</th>
                <th>B</th>
                <th>Score</th>
                <th>ETX</th>
                <th>Latency</th>
                <th>Mbps</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="links-body"></tbody>
          </table>
        </div>
      </section>

      <section class="panel panel-events">
        <h2>Event Log</h2>
        <div id="events-list" class="events-list"></div>
      </section>
    </main>

    <div id="toast" class="toast"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
