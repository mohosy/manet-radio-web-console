  <text x="476" y="540" fill="#EAF1FB" font-size="15" font-family="JetBrains Mono, monospace">route analysis + channel optimization UI</text>

  <rect x="456" y="566" width="414" height="54" rx="10" fill="#122A49"/>
  <text x="476" y="600" fill="#EAF1FB" font-size="15" font-family="JetBrains Mono, monospace">event timeline + health and KPI snapshots</text>

  <rect x="926" y="152" width="418" height="484" rx="14" fill="#17385F" stroke="#4F78A8"/>
  <text x="950" y="188" fill="#9FC0E3" font-size="13" font-family="JetBrains Mono, monospace">INTERVIEW TALK TRACK</text>

  <rect x="950" y="214" width="370" height="398" rx="10" fill="#122A49"/>
  <text x="972" y="250" fill="#EAF1FB" font-size="16" font-family="Space Grotesk, sans-serif">1. Show live topology and degraded links.</text>
  <text x="972" y="282" fill="#EAF1FB" font-size="16" font-family="Space Grotesk, sans-serif">2. Run channel optimization endpoint.</text>
  <text x="972" y="314" fill="#EAF1FB" font-size="16" font-family="Space Grotesk, sans-serif">3. Explain route output and bottlenecks.</text>
  <text x="972" y="346" fill="#EAF1FB" font-size="16" font-family="Space Grotesk, sans-serif">4. Trigger reboot and observe recovery.</text>
  <text x="972" y="378" fill="#EAF1FB" font-size="16" font-family="Space Grotesk, sans-serif">5. Point to test coverage and native C.</text>

  <text x="972" y="428" fill="#7FF2CF" font-size="15" font-family="JetBrains Mono, monospace">Outcome:</text>
  <text x="972" y="452" fill="#EAF1FB" font-size="15" font-family="Space Grotesk, sans-serif">Demonstrates practical engineering</text>
  <text x="972" y="474" fill="#EAF1FB" font-size="15" font-family="Space Grotesk, sans-serif">for embedded network management</text>
  <text x="972" y="496" fill="#EAF1FB" font-size="15" font-family="Space Grotesk, sans-serif">instead of a generic web project.</text>
