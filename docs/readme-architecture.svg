<svg width="1280" height="540" viewBox="0 0 1280 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="540" rx="20" fill="#0B1527"/>
  <rect x="28" y="24" width="1224" height="492" rx="16" fill="#0F1F37" stroke="#355276" stroke-width="2"/>

  <text x="52" y="62" fill="#E7EDF8" font-size="28" font-family="Space Grotesk, sans-serif">System Architecture</text>

