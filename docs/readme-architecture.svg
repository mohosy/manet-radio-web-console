<svg width="1400" height="760" viewBox="0 0 1400 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arch-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2DD4BF"/>
    </marker>
  </defs>

  <rect width="1400" height="760" rx="24" fill="#081426"/>
  <rect x="24" y="24" width="1352" height="712" rx="20" fill="#0E213B" stroke="#3B5E86" stroke-width="2"/>

  <text x="56" y="84" fill="#EAF1FB" font-size="38" font-family="Space Grotesk, sans-serif">System Architecture</text>
  <text x="56" y="118" fill="#B6CAE3" font-size="17" font-family="Space Grotesk, sans-serif">Embedded-style topology: browser UI, Python control plane, simulation core, and native RF metrics.</text>

  <rect x="72" y="172" width="320" height="150" rx="14" fill="#17385F" stroke="#4F78A8"/>
  <text x="96" y="208" fill="#9FC0E3" font-size="13" font-family="JetBrains Mono, monospace">WEB CLIENT</text>
  <text x="96" y="242" fill="#EAF1FB" font-size="27" font-family="Space Grotesk, sans-serif">Mobile-first Dashboard</text>
  <text x="96" y="270" fill="#CFE0F5" font-size="15" font-family="Space Grotesk, sans-serif">Topology canvas, route inspector,</text>
  <text x="96" y="292" fill="#CFE0F5" font-size="15" font-family="Space Grotesk, sans-serif">node controls, and event timeline.</text>

  <rect x="444" y="146" width="518" height="202" rx="14" fill="#17385F" stroke="#4F78A8"/>
  <text x="468" y="182" fill="#9FC0E3" font-size="13" font-family="JetBrains Mono, monospace">PYTHON SERVER (backend/server.py)</text>
  <text x="468" y="216" fill="#EAF1FB" font-size="27" font-family="Space Grotesk, sans-serif">REST + SSE Control Plane</text>
  <text x="468" y="246" fill="#CFE0F5" font-size="15" font-family="Space Grotesk, sans-serif">GET /api/health, /api/state, /api/events/log</text>
  <text x="468" y="268" fill="#CFE0F5" font-size="15" font-family="Space Grotesk, sans-serif">GET /api/route?src=&lt;id&gt;&amp;dst=&lt;id&gt;</text>
  <text x="468" y="290" fill="#CFE0F5" font-size="15" font-family="Space Grotesk, sans-serif">GET /api/events (SSE stream, 1s cadence)</text>
  <text x="468" y="312" fill="#CFE0F5" font-size="15" font-family="Space Grotesk, sans-serif">POST /api/node/&lt;id&gt;/tx_power | channel | reboot</text>
  <text x="468" y="334" fill="#CFE0F5" font-size="15" font-family="Space Grotesk, sans-serif">POST /api/network/optimize_channels</text>

  <rect x="1012" y="172" width="316" height="150" rx="14" fill="#17385F" stroke="#4F78A8"/>
  <text x="1036" y="208" fill="#9FC0E3" font-size="13" font-family="JetBrains Mono, monospace">STREAM CHANNEL</text>
  <text x="1036" y="242" fill="#EAF1FB" font-size="27" font-family="Space Grotesk, sans-serif">SSE Event Feed</text>
  <text x="1036" y="270" fill="#CFE0F5" font-size="15" font-family="Space Grotesk, sans-serif">Live state snapshots push directly</text>
  <text x="1036" y="292" fill="#CFE0F5" font-size="15" font-family="Space Grotesk, sans-serif">to the browser rendering loop.</text>

  <rect x="160" y="394" width="640" height="310" rx="14" fill="#17385F" stroke="#4F78A8"/>
  <text x="184" y="430" fill="#9FC0E3" font-size="13" font-family="JetBrains Mono, monospace">SIMULATION CORE (backend/manet_sim.py)</text>
  <text x="184" y="464" fill="#EAF1FB" font-size="27" font-family="Space Grotesk, sans-serif">Topology and Routing Engine</text>
  <text x="184" y="494" fill="#CFE0F5" font-size="15" font-family="Space Grotesk, sans-serif">Tick loop updates node motion, battery, queue depth, and link states.</text>
  <text x="184" y="516" fill="#CFE0F5" font-size="15" font-family="Space Grotesk, sans-serif">Link metrics include score, ETX, latency, throughput, and distance.</text>
  <text x="184" y="538" fill="#CFE0F5" font-size="15" font-family="Space Grotesk, sans-serif">Dijkstra route cost uses ETX plus weighted latency.</text>
  <text x="184" y="560" fill="#CFE0F5" font-size="15" font-family="Space Grotesk, sans-serif">Channel optimizer searches candidate channels [1,3,6,9,11].</text>
  <text x="184" y="582" fill="#CFE0F5" font-size="15" font-family="Space Grotesk, sans-serif">Operational events are stored in a rolling timeline.</text>

  <rect x="842" y="394" width="396" height="310" rx="14" fill="#17385F" stroke="#4F78A8"/>
  <text x="866" y="430" fill="#9FC0E3" font-size="13" font-family="JetBrains Mono, monospace">NATIVE METRIC LIB (native/link_quality.c)</text>
  <text x="866" y="464" fill="#EAF1FB" font-size="27" font-family="Space Grotesk, sans-serif">RF Functions in C</text>
  <text x="866" y="496" fill="#CFE0F5" font-size="15" font-family="JetBrains Mono, monospace">score(distance, tx_power, noise, same_channel)</text>
  <text x="866" y="520" fill="#CFE0F5" font-size="15" font-family="JetBrains Mono, monospace">capacity_mbps(quality, width_mhz, mimo_streams)</text>
  <text x="866" y="550" fill="#CFE0F5" font-size="15" font-family="Space Grotesk, sans-serif">Loaded via ctypes bridge with safe Python fallback</text>
  <text x="866" y="572" fill="#CFE0F5" font-size="15" font-family="Space Grotesk, sans-serif">for portability and deterministic tests.</text>

  <path d="M392 248H444" stroke="#2DD4BF" stroke-width="3" marker-end="url(#arch-arrow)"/>
  <path d="M962 248H1012" stroke="#2DD4BF" stroke-width="3" marker-end="url(#arch-arrow)"/>
  <path d="M702 348V394" stroke="#2DD4BF" stroke-width="3" marker-end="url(#arch-arrow)"/>
  <path d="M842 550H800" stroke="#2DD4BF" stroke-width="3" marker-end="url(#arch-arrow)"/>

  <rect x="1010" y="620" width="318" height="84" rx="10" fill="#123355" stroke="#4F78A8"/>
  <text x="1034" y="652" fill="#9FC0E3" font-size="12" font-family="JetBrains Mono, monospace">QUALITY SIGNALS</text>
  <text x="1034" y="680" fill="#EAF1FB" font-size="17" font-family="Space Grotesk, sans-serif">Routing KPIs + test automation +</text>
  <text x="1034" y="700" fill="#EAF1FB" font-size="17" font-family="Space Grotesk, sans-serif">native metric validation.</text>
</svg>
