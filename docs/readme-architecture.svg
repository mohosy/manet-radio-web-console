  <text x="452" y="184" fill="#C3D4EA" font-size="16" font-family="Space Grotesk, sans-serif">/api/state, /api/route, /api/network/optimize_channels</text>

  <rect x="870" y="110" width="340" height="94" rx="12" fill="#173054" stroke="#3E628E"/>
  <text x="892" y="148" fill="#9EB2CE" font-size="13" font-family="JetBrains Mono, monospace">LIVE STREAM</text>
