  <text x="712" y="376" fill="#C3D4EA" font-size="16" font-family="Space Grotesk, sans-serif">link_quality_score(distance, tx, noise, channel)</text>
  <text x="712" y="404" fill="#C3D4EA" font-size="16" font-family="Space Grotesk, sans-serif">link_capacity_mbps(quality, bandwidth, streams)</text>

